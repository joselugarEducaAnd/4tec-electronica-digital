<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 295" width="940" height="295" role="img" aria-label="Interruptores en serie, que se comportan como Y, e interruptores en paralelo, que se comportan como O" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Interruptores en serie, que se comportan como Y, e interruptores en paralelo, que se comportan como O</title><rect x="0" y="0" width="940" height="295" fill="#ffffff"/><text x="230" y="34" font-size="19" fill="#22425c" text-anchor="middle" font-weight="bold">Y: interruptores en serie</text><line x1="30" y1="144" x2="70" y2="144" stroke="#1d2733" stroke-width="3"/><line x1="39" y1="156" x2="61" y2="156" stroke="#1d2733" stroke-width="7"/><path d="M50,144 L50,100 L100,100" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><circle cx="100" cy="100" r="5" fill="#1d2733"/><circle cx="150" cy="100" r="5" fill="#1d2733"/><line x1="100" y1="100" x2="144" y2="76" stroke="#1d2733" stroke-width="3"/><text x="125" y="70" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">A</text><path d="M150,100 L200,100" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><circle cx="200" cy="100" r="5" fill="#1d2733"/><circle cx="250" cy="100" r="5" fill="#1d2733"/><line x1="200" y1="100" x2="244" y2="76" stroke="#1d2733" stroke-width="3"/><text x="225" y="70" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">B</text><path d="M250,100 L360,100 L360,132" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><circle cx="360" cy="150" r="18" fill="#ffffff" stroke="#1d2733" stroke-width="3"/><line x1="348" y1="138" x2="372" y2="162" stroke="#1d2733" stroke-width="2"/><line x1="348" y1="162" x2="372" y2="138" stroke="#1d2733" stroke-width="2"/><text x="388" y="157" font-size="18" fill="#22425c" text-anchor="start" font-weight="bold">S</text><path d="M360,168 L360,230 L50,230 L50,156" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><text x="230" y="275" font-size="16" fill="#1d2733" text-anchor="middle" font-weight="normal">Luce solo si A y B están cerrados.</text><text x="690" y="34" font-size="19" fill="#22425c" text-anchor="middle" font-weight="bold">O: interruptores en paralelo</text><line x1="490" y1="144" x2="530" y2="144" stroke="#1d2733" stroke-width="3"/><line x1="499" y1="156" x2="521" y2="156" stroke="#1d2733" stroke-width="7"/><path d="M510,144 L510,90 L600,90" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><circle cx="600" cy="90" r="5" fill="#1d2733"/><circle cx="650" cy="90" r="5" fill="#1d2733"/><line x1="600" y1="90" x2="644" y2="66" stroke="#1d2733" stroke-width="3"/><text x="625" y="60" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">A</text><path d="M650,90 L740,90 L740,160 L650,160" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><circle cx="600" cy="160" r="5" fill="#1d2733"/><circle cx="650" cy="160" r="5" fill="#1d2733"/><line x1="600" y1="160" x2="644" y2="136" stroke="#1d2733" stroke-width="3"/><text x="625" y="130" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">B</text><path d="M600,160 L570,160 L570,90" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><path d="M740,125 L820,125 L820,132" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><circle cx="820" cy="150" r="18" fill="#ffffff" stroke="#1d2733" stroke-width="3"/><line x1="808" y1="138" x2="832" y2="162" stroke="#1d2733" stroke-width="2"/><line x1="808" y1="162" x2="832" y2="138" stroke="#1d2733" stroke-width="2"/><text x="848" y="157" font-size="18" fill="#22425c" text-anchor="start" font-weight="bold">S</text><path d="M820,168 L820,230 L510,230 L510,156" fill="none" stroke="#1d2733" stroke-width="3" stroke-linejoin="round"/><text x="690" y="275" font-size="16" fill="#1d2733" text-anchor="middle" font-weight="normal">Luce si A o B (o los dos) están cerrados.</text></svg>