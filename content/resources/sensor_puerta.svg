<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" width="940" height="345" role="img" aria-label="Sensor de la puerta: P vale 0 con la puerta cerrada y 1 cuando detecta la puerta abierta" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Sensor de la puerta: P vale 0 con la puerta cerrada y 1 cuando detecta la puerta abierta</title><rect x="0" y="0" width="940" height="345" fill="#ffffff"/><rect x="30" y="30" width="400" height="270" rx="12" fill="#f6f8fa" stroke="#c9d4de" stroke-width="2"/><rect x="70" y="190" width="30" height="20" fill="#5f6b77"/><rect x="360" y="190" width="30" height="20" fill="#5f6b77"/><rect x="330" y="212" width="22" height="14" fill="#1d2733"/><text x="341" y="248" font-size="13" fill="#4b5866" text-anchor="middle" font-weight="normal">sensor</text><line x1="100" y1="200" x2="352.0" y2="200.0" stroke="#22425c" stroke-width="10" stroke-linecap="round"/><rect x="321.0" y="178.0" width="18" height="12" fill="#b34700" transform="rotate(0 330.0 200.0)"/><text x="230" y="58" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">Puerta cerrada</text><text x="230" y="284" font-size="24" fill="#1d2733" text-anchor="middle" font-weight="bold">P = 0</text><rect x="470" y="30" width="400" height="270" rx="12" fill="#f6f8fa" stroke="#c9d4de" stroke-width="2"/><rect x="510" y="190" width="30" height="20" fill="#5f6b77"/><rect x="800" y="190" width="30" height="20" fill="#5f6b77"/><rect x="770" y="212" width="22" height="14" fill="#1d2733"/><text x="781" y="248" font-size="13" fill="#4b5866" text-anchor="middle" font-weight="normal">sensor</text><line x1="540" y1="200" x2="768.4" y2="93.5" stroke="#22425c" stroke-width="10" stroke-linecap="round"/><rect x="739.5" y="80.8" width="18" height="12" fill="#b34700" transform="rotate(-25 748.5 102.8)"/><text x="670" y="58" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">Puerta abierta</text><text x="670" y="284" font-size="24" fill="#b34700" text-anchor="middle" font-weight="bold">P = 1</text><text x="470" y="330" font-size="16" fill="#1d2733" text-anchor="middle" font-weight="normal">Definición: P = 1 significa «el sensor detecta la puerta abierta».</text></svg>