<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 230" width="890" height="230" role="img" aria-label="Sistema digital: entradas, decisión y salida en el ejemplo de la alarma" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif"><title>Sistema digital: entradas, decisión y salida en el ejemplo de la alarma</title><rect x="0" y="0" width="890" height="230" fill="#ffffff"/><rect x="20" y="50" width="230" height="150" rx="12" fill="#ffffff" stroke="#22425c" stroke-width="3"/><text x="135" y="82" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">ENTRADAS</text><text x="40" y="122" font-size="15" fill="#1d2733" text-anchor="start" font-weight="normal">C: alarma conectada</text><text x="40" y="152" font-size="15" fill="#1d2733" text-anchor="start" font-weight="normal">P: sensor de la puerta</text><text x="135" y="186" font-size="13" fill="#4b5866" text-anchor="middle" font-weight="normal">lo que el sistema recibe</text><line x1="255" y1="125" x2="325" y2="125" stroke="#22425c" stroke-width="3"/><polygon points="325,125 313.9,129.7 313.9,120.3" fill="#22425c"/><rect x="330" y="50" width="230" height="150" rx="12" fill="#ffffff" stroke="#22425c" stroke-width="3"/><text x="445" y="82" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">DECISIÓN</text><text x="445" y="122" font-size="15" fill="#1d2733" text-anchor="middle" font-weight="normal">circuito lógico</text><text x="445" y="152" font-size="18" fill="#1d2733" text-anchor="middle" font-weight="bold">S = C · P</text><text x="445" y="186" font-size="13" fill="#4b5866" text-anchor="middle" font-weight="normal">aplica una regla fija</text><line x1="565" y1="125" x2="635" y2="125" stroke="#22425c" stroke-width="3"/><polygon points="635,125 623.9,129.7 623.9,120.3" fill="#22425c"/><rect x="640" y="50" width="230" height="150" rx="12" fill="#ffffff" stroke="#22425c" stroke-width="3"/><text x="755" y="82" font-size="18" fill="#22425c" text-anchor="middle" font-weight="bold">SALIDA</text><text x="660" y="122" font-size="15" fill="#1d2733" text-anchor="start" font-weight="normal">S: sirena</text><text x="660" y="152" font-size="15" fill="#1d2733" text-anchor="start" font-weight="normal">1 = suena</text><text x="755" y="186" font-size="13" fill="#4b5866" text-anchor="middle" font-weight="normal">lo que el sistema produce</text></svg>